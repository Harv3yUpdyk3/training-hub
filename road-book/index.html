<style>
:root{--bg:#1c2024;--fg:#f5f6f3;--muted:#a0a8b0;--jaune:#f2c200;--jaune-ink:#3a2f00;--line:#454c52;--err:#ff5a6e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}

p{margin:0;color:var(--muted);font-size:14px}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#14171a;color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--jaune);outline-offset:2px}
button{font:600 16px system-ui,sans-serif;padding:12px;border:0;border-radius:10px;background:var(--jaune);color:var(--jaune-ink);cursor:pointer}

</style>

const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un(B.iv)},key,un(B.ct)));
  try{localStorage.setItem("tdf27-pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err");
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";

(async()=>{let saved=null;try{saved=localStorage.getItem("tdf27-pw")}catch(e){}
  if(saved){try{await open(saved);return}catch(e){try{localStorage.removeItem("tdf27-pw")}catch(_){}}}
  f.hidden=false;document.getElementById("pw").focus();})();
