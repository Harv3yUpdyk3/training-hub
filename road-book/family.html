function parisNow(){const f=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});

  h+=`<div class="card"><p class="k">Sleeping tonight</p><p class="what"><b>${d.night}</b></p></div>`;
  if(e)h+=`<p class="muted">Times are estimates and can shift by 20 to 30 minutes on the day.</p>`;
  document.getElementById("view").innerHTML=h;}
document.getElementById("prev").onclick=()=>{if(sel>0){sel--;render();}};
document.getElementById("next").onclick=()=>{if(sel<N-1){sel++;render();}};
document.getElementById("tod").onclick=()=>{sel=todayIdx(parisNow());render();};
render();setInterval(render,60000);
</script></body></html>
