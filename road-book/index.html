<style>
:root{--bg:#1c2024;--fg:#f5f6f3;--muted:#a0a8b0;--jaune:#f2c200;--jaune-ink:#3a2f00;--line:#454c52;--err:#ff5a6e;color-scheme:dark}

const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un(B.iv)},key,un(B.ct)));
  try{localStorage.setItem("tdf27-pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}

(async()=>{let saved=null;try{saved=localStorage.getItem("tdf27-pw")}catch(e){}
