const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function wkey(pw,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:un(salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function open(pw){
  let raw=null;
  for(const k of B.keys){try{raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(k.iv)},await wkey(pw,k.salt),un(k.k));break}catch(e){}}
  if(!raw)throw new Error("bad password");
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:un(B.iv)},key,un(B.ct)));
  try{localStorage.setItem("tdf27-pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err");
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";
  try{await open(document.getElementById("pw").value)}catch(x){err.textContent="That password didn't work. Try again."}});
(async()=>{let saved=null;try{saved=localStorage.getItem("tdf27-pw")}catch(e){}
  if(saved){try{await open(saved);return}catch(e){try{localStorage.removeItem("tdf27-pw")}catch(_){}}}
  f.hidden=false;document.getElementById("pw").focus();})();
</script>
